services:
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fxbank_development
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/fxbank_development
      RAILS_ENV: development
      RAILS_MAX_THREADS: 5
      SECRET_KEY_BASE: development_secret_key_base_fxbank_1234567890
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    command: bin/rails server -b 0.0.0.0

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/fxbank_development
      RAILS_ENV: development
      SOLID_QUEUE_IN_PUMA: "false"
    command: bin/rails solid_queue:start

volumes:
  postgres_data:
  bundle_data:
